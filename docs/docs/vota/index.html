<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Simulazione Voto - Flip + X e Testo + Piegatura</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #eee;
      font-family: sans-serif;
    }

    .scene {
      width: 100vw;
      height: 100vh;
      perspective: 2000px;
      position: relative;
      overflow: hidden;
    }

    .card {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      transform-style: preserve-3d;
      transition: transform 1s;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card.unflipped {
      transform: rotateY(0deg);
    }

    .face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      transform: rotateY(0deg);
    }

    .face.front img,
    .face.back img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .back {
      transform: rotateY(180deg);
    }

    .overlay, .name-label {
      opacity: 0;
      transition: opacity 0.5s ease-in;
      position: absolute;
      z-index: 10;
      pointer-events: none;
    }

    .overlay {
      top: calc(40.57% - 10px);
      left: calc(69.72% - 45px);
      transform: translate(-50%, -50%);
      font-size: 6vw;
      font-weight: bold;
      color: black;
    }

    .name-label {
      top: 39.07%;
      left: 74.08%;
      transform: translateY(-50%);
      font-size: 2.5vw;
      font-weight: bold;
      color: black;
      font-family: 'Great Vibes', cursive;
    }

    .show-vote .overlay,
    .show-vote .name-label {
      opacity: 1;
    }

    .fold-left, .fold-right {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      overflow: hidden;
      z-index: 20;
      background: white;
      transform-origin: center;
      transition: transform 1s ease-in-out;
    }

    .fold-left {
      left: 0;
    }

    .fold-right {
      right: 0;
    }

    .fold-left.folded {
      transform: rotateY(90deg);
    }

    .fold-right.folded {
      transform: rotateY(-90deg);
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="card" id="card">
      <div class="face front">
        <img src="svg_pages/page_1.svg" alt="Pagina 1" />
      </div>
      <div class="face back">
        <img src="svg_pages/page_2.svg" alt="Pagina 2" />
      </div>
    </div>
    <div class="overlay">X</div>
    <div class="name-label">Tizio Caio</div>
    <div class="fold-left" id="foldLeft"></div>
    <div class="fold-right" id="foldRight"></div>
  </div>

  <script>
    setTimeout(() => {
      document.getElementById('card').classList.add('flipped');
    }, 2000);

    setTimeout(() => {
      document.querySelector('.scene').classList.add('show-vote');
    }, 4000);

    setTimeout(() => {
      document.getElementById('card').classList.remove('flipped');
      document.getElementById('card').classList.add('unflipped');
    }, 6000);

    setTimeout(() => {
      document.getElementById('foldLeft').classList.add('folded');
      document.getElementById('foldRight').classList.add('folded');
    }, 8000);
  </script>
</body>
</html>
