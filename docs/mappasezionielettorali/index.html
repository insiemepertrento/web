<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mappa sezioni elettorali - Trento</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://unpkg.com/maplibre-gl@4.7.0/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@4.3.0/dist/pmtiles.js"></script>
  <style>
    body { margin: 0; }
    #map { width: 100vw; height: 100vh; }
    #controls, #legend {
      position: absolute;
      background: white;
      padding: 10px;
      border-radius: 5px;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
      font-family: sans-serif;
      font-size: 12px;
      z-index: 10;
    }
    #controls { top: 10px; left: 10px; }
    #legend { bottom: 10px; left: 10px; max-height: 300px; overflow: auto; z-index: 5; }
    #tooltip {
      position: absolute;
      display: none;
      padding: 4px;
      background: white;
      border: 1px solid gray;
      border-radius: 3px;
      font-family: sans-serif;
      font-size: 12px;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="loading" style="position:absolute;top:10px;right:10px;background:white;padding:6px 12px;border-radius:4px;box-shadow:0 0 5px rgba(0,0,0,0.3);font-family:sans-serif;font-size:13px;z-index:20">⏳ Caricamento in corso...</div>
  <div id="map"></div>
  <div id="controls">
    <b>Filtra per:</b><br />
    <label>🏛 Circoscrizione:</label><br />
    <select id="select-circoscrizione"></select><br />
    <label>🏫 Sede:</label><br />
    <select id="select-sede" disabled></select><br />
    <label>🗳 Sezione:</label><br />
    <select id="select-sezione" disabled></select><br />
    <button id="reset-button">Reset filtri</button><br />
    <button id="fit-button">🗺️ Inquadra tutto</button>
    <br /><div id="status" style="margin-top:5px;color:#555;"></div>
  </div>
  <div id="legend"></div>
  <div id="tooltip"></div>

  <script>
    let protocol = new pmtiles.Protocol({ metadata: true });
    maplibregl.addProtocol("pmtiles", protocol.tile);

    const map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: [11.121, 46.07],
      zoom: 13
    });
    map.addControl(new maplibregl.NavigationControl(), "top-right");

    const coloreSezione = "#800080";
    const coloriCircoscrizioni = {}, coloriSedi = {}, coloriSezioni = {};

    const selectC = document.getElementById("select-circoscrizione");
    const selectS = document.getElementById("select-sede");
    const selectZ = document.getElementById("select-sezione");
    const resetButton = document.getElementById("reset-button");
    const fitButton = document.getElementById("fit-button");
    const legendDiv = document.getElementById("legend");
    const statusDiv = document.getElementById("status");
    const tooltip = document.getElementById("tooltip");

    let allFeatures = [];
    let defaultCamera = null;

    const generaColore = () => `#${Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0')}`;

    const aggiornaLegenda = () => {
      const count = filterFeatures({ circ: selectC.value, sede: selectS.value, sezione: selectZ.value }).length;
      statusDiv.textContent = count + (count === 1 ? " punto trovato" : " punti trovati");

      legendDiv.innerHTML = "<b>Legenda</b><br/>";
      const circ = selectC.value;
      const sede = selectS.value;
      const sez = selectZ.value;

      if (sez) {
        const f = allFeatures.find(f => f.properties.sez_elett == sez);
        if (f) {
          const c = f.properties.circoscrizione;
          legendDiv.innerHTML += `<div><span style='background:${coloriCircoscrizioni[c]};width:12px;height:12px;display:inline-block;margin-right:5px;'></span>Sezione ${sez} (${c})</div>`;
        }
      } else if (sede) {
        const features = filterFeatures({ sede });
        const sezioni = [...new Set(features.map(f => f.properties.sez_elett))];
        sezioni.sort((a, b) => a - b).forEach(sez => {
          if (coloriSezioni[sez]) {
            legendDiv.innerHTML += `<div><span style='background:${coloriSezioni[sez]};width:12px;height:12px;display:inline-block;margin-right:5px;'></span>Sezione ${sez}</div>`;
          }
        });
      } else if (circ) {
        const features = filterFeatures({ circ });
        const sedi = [...new Set(features.map(f => f.properties.sede))];
        sedi.sort().forEach(s => {
          if (coloriSedi[s]) {
            legendDiv.innerHTML += `<div><span style='background:${coloriSedi[s]};width:12px;height:12px;display:inline-block;margin-right:5px;'></span>${s}</div>`;
          }
        });
      } else {
        Object.entries(coloriCircoscrizioni).sort().forEach(([nome, colore]) => {
          legendDiv.innerHTML += `<div><span style='background:${colore};width:12px;height:12px;display:inline-block;margin-right:5px;'></span>${nome}</div>`;
        });
      }
    };

    const aggiornaSelect = (select, values, disabled) => {
      select.innerHTML = "";
      select.disabled = disabled;
      const optAll = document.createElement("option");
      optAll.value = "";
      optAll.textContent = "-- Vedi tutte --";
      select.appendChild(optAll);
      if (!disabled) {
        values.sort((a, b) => (!isNaN(a) && !isNaN(b)) ? a - b : a.localeCompare(b)).forEach(val => {
          const opt = document.createElement("option");
          opt.value = val;
          opt.textContent = val;
          select.appendChild(opt);
        });
      }
    };

    const coloreCircoscrizioneExpr = () => {
      const expr = ["match", ["get", "circoscrizione"]];
      Object.entries(coloriCircoscrizioni).forEach(([k, v]) => expr.push(k, v));
      // Forza almeno 2 coppie per evitare errore MapLibre
      expr.push("__dummy__", "rgba(0,0,0,0)");
      expr.push("rgba(0,0,0,0)");
      return expr;
    };

    const filterFeatures = (filter) => {
      return allFeatures.filter(f => {
        return (!filter.circ || f.properties.circoscrizione === filter.circ) &&
               (!filter.sede || f.properties.sede === filter.sede) &&
               (!filter.sezione || f.properties.sez_elett == filter.sezione);
      });
    };

    const aggiornaMappa = (expr) => {
      map.setPaintProperty("sezioni_elettorali_layer", "circle-color", expr);
    };

    const aggiornaFiltriDaCircoscrizione = (circ) => {
      const filtrati = filterFeatures({ circ });
      const sedi = [...new Set(filtrati.map(f => f.properties.sede))];
      const sezioni = [...new Set(filtrati.map(f => f.properties.sez_elett))];
      aggiornaSelect(selectS, sedi, false);
      aggiornaSelect(selectZ, sezioni.sort((a, b) => a - b), false);

      const expr = ["match", ["get", "sede"]];
      sedi.forEach(s => {
        if (!coloriSedi[s]) {
          const f = filtrati.find(f => f.properties.sede === s);
          const base = coloriCircoscrizioni[f.properties.circoscrizione].replace('#','');
          const r = Math.min(255, parseInt(base.substring(0,2),16) + 40);
          const g = Math.min(255, parseInt(base.substring(2,4),16) + 40);
          const b = Math.min(255, parseInt(base.substring(4,6),16) + 40);
          coloriSedi[s] = `rgb(${r},${g},${b})`;
        }
        expr.push(s, coloriSedi[s]);
      });
      expr.push("rgba(0,0,0,0)");
      aggiornaMappa(expr);
    };

    const aggiornaFiltriDaSede = (sede) => {
  if (!sede) {
    const allCirc = [...new Set(allFeatures.map(f => f.properties.circoscrizione))];
    aggiornaSelect(selectC, allCirc, false);
    aggiornaSelect(selectZ, [], true);
    aggiornaMappa(coloreCircoscrizioneExpr());
    return;
  }
  const filtrati = filterFeatures({ sede });
  const circ = [...new Set(filtrati.map(f => f.properties.circoscrizione))];
  const sezioni = [...new Set(filtrati.map(f => f.properties.sez_elett))];
  aggiornaSelect(selectC, circ, false);
  aggiornaSelect(selectZ, sezioni.sort((a, b) => a - b), false);

  const expr = ["match", ["get", "sez_elett"]];
  sezioni.forEach(sez => {
    if (!coloriSezioni[sez]) {
      const f = filtrati.find(f => f.properties.sez_elett === sez);
      const base = coloriSedi[f.properties.sede].replace(/rgb\(|\)/g, '').split(',').map(Number);
      const r = Math.min(255, base[0] + 40);
      const g = Math.min(255, base[1] + 40);
      const b = Math.min(255, base[2] + 40);
      coloriSezioni[sez] = `rgb(${r},${g},${b})`;
    }
    expr.push(sez, coloriSezioni[sez]);
  });
  // Forza almeno due coppie valore-colore per evitare errori
  expr.push(-9999, "rgba(0,0,0,0)");
  expr.push("rgba(0,0,0,0)");
      aggiornaMappa(expr);
    };

    const aggiornaDaSezione = (sezione) => {
  const id = parseInt(sezione);
  if (isNaN(id)) return;

  // Trova il primo punto della sezione per recuperare le coordinate
  const f = allFeatures.find(f => f.properties.sez_elett == id);
  if (!f) return;

  // Calcolare il bounding box per la sezione
  const allCoords = allFeatures.filter(f => f.properties.sez_elett == id).map(f => f.geometry.coordinates);
  const bounds = allCoords.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(allCoords[0], allCoords[0]));

  // Esegui lo zoom sui punti della sezione
  map.fitBounds(bounds, { padding: 40 });

  // Ripristina la colorazione per la sezione
  const colore = coloriCircoscrizioni[f.properties.circoscrizione] || coloreSezione;
  aggiornaMappa(["match", ["get", "sez_elett"], id, colore, -9999, "rgba(0,0,0,0)", "rgba(0,0,0,0)"]);

  // Aggiorna la legenda con il colore della sezione
  aggiornaLegenda();
};

/*
const aggiornaDaSezione = (sezione) => {
  const id = parseInt(sezione);
  if (isNaN(id)) return;

  const f = allFeatures.find(f => f.properties.sez_elett == id);
  if (!f) return;

  const coord = f.geometry.coordinates;

  // Calcolo del bounding box per la sezione
  const allCoords = allFeatures.filter(f => f.properties.sez_elett == id).map(f => f.geometry.coordinates);
  const bounds = allCoords.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(allCoords[0], allCoords[0]));

  // Applicare lo zoom alla mappa
  map.fitBounds(bounds, { padding: 40 });

  // Aggiorna la mappa con il colore della circoscrizione per la sezione
  const colore = coloriCircoscrizioni[f.properties.circoscrizione] || coloreSezione;
  aggiornaMappa(["match", ["get", "sez_elett"], id, colore, -9999, "rgba(0,0,0,0)", "rgba(0,0,0,0)"]);
};
*/

    resetButton.addEventListener("click", () => {
      statusDiv.textContent = "";
      selectC.value = "";
      selectS.value = "";
      selectZ.value = "";
      aggiornaSelect(selectS, [], true);
      aggiornaSelect(selectZ, [], true);
      aggiornaLegenda();
      aggiornaMappa(coloreCircoscrizioneExpr());
    });

    selectC.addEventListener("change", () => {
      const val = selectC.value;
      selectS.value = "";
      selectZ.value = "";
      aggiornaSelect(selectS, [], true);
      aggiornaSelect(selectZ, [], true);
      if (!val) {
        aggiornaLegenda();
        aggiornaMappa(coloreCircoscrizioneExpr());
        return;
      }
      aggiornaFiltriDaCircoscrizione(val);
      aggiornaLegenda();

      // Zoom ai bounds della circoscrizione filtrata
      const filtrati = filterFeatures({ circ: val });
      if (filtrati.length > 0) {
        const coords = filtrati.map(f => f.geometry.coordinates);
        const bounds = coords.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(coords[0], coords[0]));
        map.fitBounds(bounds, { padding: 40 });
      }
    });

    fitButton.addEventListener("click", () => {
      if (defaultCamera) {
        map.setCenter(defaultCamera.center);
        map.setZoom(defaultCamera.zoom);
      }
    });

    selectS.addEventListener("change", () => {
      const val = selectS.value;
      selectZ.value = "";
      aggiornaSelect(selectZ, [], true);
      if (!val) {
        const circoscrizioni = [...new Set(allFeatures.map(f => f.properties.circoscrizione))];
        aggiornaSelect(selectC, circoscrizioni, false);
        aggiornaLegenda();
        aggiornaMappa(coloreCircoscrizioneExpr());
        return;
      }
      aggiornaFiltriDaSede(val);
      aggiornaLegenda();
      const filtrati = filterFeatures({ sede: val });
      if (filtrati.length > 0) {
        const coords = filtrati.map(f => f.geometry.coordinates);
        const bounds = coords.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(coords[0], coords[0]));
        map.fitBounds(bounds, { padding: 40 });
      }
    });

    selectZ.addEventListener("change", () => {
      const val = selectZ.value;
      if (!val) {
        if (selectS.value) {
          aggiornaFiltriDaSede(selectS.value);
        } else if (selectC.value) {
          aggiornaFiltriDaCircoscrizione(selectC.value);
        } else {
          aggiornaMappa(coloreCircoscrizioneExpr());
        }
        aggiornaLegenda();
        return;
      }
      aggiornaDaSezione(val);
      aggiornaLegenda();
      const f = allFeatures.find(f => f.properties.sez_elett == val);
      if (f) {
        const coord = f.geometry.coordinates;
        map.flyTo({ center: coord, zoom: 16 });
      }
    });

    map.on("load", async () => {
      const pmtilesSource = new pmtiles.PMTiles("sezioni_elettorali.pmtiles");
      const header = await pmtilesSource.getHeader();
      const fullBounds = [
        [header.minLon, header.minLat],
        [header.maxLon, header.maxLat]
      ];
      const camera = map.cameraForBounds(fullBounds, { padding: 20 });
      if (camera) {
        map.setCenter(camera.center);
        const reducedZoom = Math.max(camera.zoom - 1, map.getMinZoom());
        map.setZoom(reducedZoom);
        const maxBounds = map.getBounds();
        map.setMaxBounds(maxBounds);
        defaultCamera = {
          center: map.getCenter(),
          zoom: map.getZoom(),
          bounds: map.getBounds()
        };
      }

      map.addSource("sezioni_elettorali", {
        type: "vector",
        url: "pmtiles://sezioni_elettorali.pmtiles"
      });
      map.addLayer({
        id: "sezioni_elettorali_layer",
        type: "circle",
        source: "sezioni_elettorali",
        "source-layer": "sezioni",
        paint: { "circle-radius": 5, "circle-color": "rgba(0,0,0,0)" }
      });

      map.once("idle", () => {
        document.getElementById("loading").style.display = "none";
        allFeatures = map.queryRenderedFeatures({ layers: ["sezioni_elettorali_layer"] });
        allFeatures.forEach(f => {
          const { circoscrizione } = f.properties;
          if (!coloriCircoscrizioni[circoscrizione]) coloriCircoscrizioni[circoscrizione] = generaColore();
        });
        const circoscrizioni = [...new Set(allFeatures.map(f => f.properties.circoscrizione))];
        aggiornaSelect(selectC, circoscrizioni, false);
        aggiornaLegenda();
        aggiornaMappa(coloreCircoscrizioneExpr());
      });
    });

    map.on("mousemove", "sezioni_elettorali_layer", e => {
      const props = e.features[0].properties;
      tooltip.innerHTML = `<b>Sezione:</b> ${props.sez_elett}<br/><b>Sede:</b> ${props.sede}<br/><b>Circoscrizione:</b> ${props.circoscrizione}`;
      tooltip.style.display = "block";
      tooltip.style.left = (e.originalEvent.pageX + 10) + "px";
      tooltip.style.top = (e.originalEvent.pageY + 10) + "px";
    });

    map.on("mouseleave", "sezioni_elettorali_layer", () => {
      tooltip.style.display = "none";
    });
  </script>
</body>
</html>
